<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10101a">
  <title>Arcade Theme Preview — Handlevault</title>
  <style>
    :root{font-family:"Courier New",Courier,monospace;color:#e8e7f2;background:#10101a;--pink:#ff71ce;--gold:#ffd166;--cyan:#00f0ff;--line:#343449}
    *{box-sizing:border-box}body{margin:0;background:#10101a;color:#e8e7f2}.shell{max-width:1280px;margin:auto;padding:20px}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);padding:16px;border-radius:10px;margin-bottom:12px}
    h1{color:var(--pink);text-shadow:0 0 7px #ff71ce66;margin:0;font-size:22px}p{color:var(--cyan)}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{font:inherit;color:var(--pink);border:1px solid var(--line);background:transparent;padding:9px 12px;border-radius:7px;cursor:pointer}.tabs button[aria-pressed=true]{border-color:var(--pink);text-shadow:0 0 7px #ff71ce66}
    .notice{border:1px solid var(--line);padding:10px 12px;border-radius:8px;color:var(--cyan);font-size:13px;margin:10px 0}
    .frame{height:min(78vh,900px);min-height:520px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#10101a}iframe{width:100%;height:100%;border:0}
    @media(max-width:600px){.shell{padding:12px}.frame{min-height:70vh}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div><h1>Colored Attention Fonts · Preview</h1><p>Courier New arcade styling with colored attention text and thin container borders.</p></div></header>
    <nav class="tabs" aria-label="Preview an app">
      <button type="button" data-page="pixel-studio.html" aria-pressed="true">Pixel Studio</button>
      <button type="button" data-page="invoice.html" aria-pressed="false">Invoice Studio</button>
      <button type="button" data-page="resume.html" aria-pressed="false">Resume &amp; CV Studio</button>
      <button type="button" data-page="moonlit-beads.html" aria-pressed="false">Moonlit Beads</button>
      <button type="button" data-page="seasonal-studio.html" aria-pressed="false">Seasonal Studio add-on</button>
    </nav>
    <div class="notice"><strong style="color:var(--gold)">Gold</strong> = warnings/totals · <strong style="color:var(--pink)">Pink</strong> = primary actions/headers · <strong style="color:var(--cyan)">Cyan</strong> = status notes/tips</div>
    <section class="frame"><iframe id="appPreview" title="Pixel Studio arcade theme preview" src="pixel-studio.html"></iframe></section>
  </main>
  <script>
    (() => {
      const frame = document.getElementById('appPreview');
      const themeUrl = new URL('arcade-attention.css', location.href).href;
      function applyTheme() {
        try {
          const doc = frame.contentDocument;
          if (!doc || !doc.head) return;
          if (!doc.querySelector('link[data-arcade-preview]')) {
            const link = doc.createElement('link');
            link.rel = 'stylesheet';
            link.href = themeUrl;
            link.dataset.arcadePreview = 'true';
            doc.head.appendChild(link);
          }
          doc.querySelectorAll('h1,h2,.brand h1,.intro h2').forEach(el => el.classList.add('attention-primary'));
          doc.querySelectorAll('.statusbar,.status,.hint,.privacy,.tagline').forEach(el => el.classList.add('attention-info'));
          doc.querySelectorAll('.total,.totals,.grand,.error,.warning,[role="alert"]').forEach(el => el.classList.add('attention-warning'));
          doc.querySelectorAll('button.primary,.btn.primary,[type="submit"],.add-item').forEach(el => el.classList.add('attention-button'));
        } catch { /* The preview remains usable if a browser blocks iframe styling. */ }
      }
      frame.addEventListener('load', applyTheme);
      document.querySelectorAll('[data-page]').forEach(button => button.addEventListener('click', () => {
        document.querySelectorAll('[data-page]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        frame.title = `${button.textContent.trim()} arcade theme preview`;
        frame.src = button.dataset.page;
      }));
      applyTheme();
    })();
  </script>
</body>
</html>
