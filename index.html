!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Crisp Pixel Converter</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --border-color: #334155;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border: 2px solid var(--accent-color);
            padding: 20px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            color: var(--accent-color);
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .tool-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="file"], select, button {
            width: 100%;
            padding: 10px;
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: inherit;
            box-sizing: border-box;
        }
        button {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .preview-container {
            margin-top: 20px;
            text-align: center;
            border: 1px dashed var(--border-color);
            padding: 15px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090d16;
        }
        canvas {
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            line-height: 1.6;
        }
        .footer a {
            color: var(--accent-color);
            text-decoration: none;
        }
        .footer .kofi-link {
            color: #f472b6;
            font-weight: bold;
        }
    </style>
</head>
<body>
