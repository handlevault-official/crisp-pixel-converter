<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Arcade Crisp Studio - Direct Render & Download</title>
    <style>
        :root {
            --arcade-bg: #0d050a;
            --arcade-panel: #1a0d14;
            --arcade-border: #ff007f;
            --arcade-pink: #ff3399;
            --arcade-yellow: #ffee00;
            --text-color: #ff3399;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--arcade-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 750px;
            background: var(--arcade-panel);
            border: 3px solid var(--arcade-border);
            padding: 25px;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4), inset 0 0 15px rgba(255, 0, 127, 0.2);
            border-radius: 4px;
        }
        h1 {
            text-align: center;
            color: var(--arcade-yellow);
            font-size: 1.4rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px var(--arcade-border);
            letter-spacing: 2px;
        }
        .tool-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: var(--arcade-yellow);
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        input[type="file"], button {
            width: 100%;
            padding: 12px;
            background: #000;
            color: var(--text-color);
            border: 2px solid var(--arcade-border);
            border-radius: 0px;
            font-family: inherit;
            font-weight: bold;
            box-sizing: border-box;
            outline: none;
        }
        input[type="file"] {
            cursor: pointer;
            font-size: 0.75rem;
        }
        button {
            background-color: var(--arcade-yellow);
            color: #000;
            cursor: pointer;
            margin-top: 10px;
            border-color: var(--arcade-yellow);
            box-shadow: 0 0 10px rgba(255, 238, 0, 0.5);
            transition: all 0.1s;
            text-transform: uppercase;
        }
        button:hover {
            background-color: var(--arcade-border);
            border-color: var(--arcade-border);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.7);
        }
        .preview-container {
            margin-top: 20px;
            text-align: center;
            border: 2px dashed var(--arcade-border);
            padding: 15px;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050204;
            overflow: auto;
        }
        canvas {
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            line-height: 1.8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .footer a {
            color: var(--arcade-yellow);
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .footer .kofi-link {
            color: var(--arcade-border);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>[ ULTIMATE ARCADE CRISP STUDIO ]</h1>
        
        <div class="tool-group">
            <label for="imageUpload">> 1. Select Source Image</label>
            <input type="file" id="imageUpload" accept="image/*" onchange="handleImage(event)">
        </div>

        <div class="preview-container">
            <canvas id="previewCanvas">UPLOAD IMAGE TO RENDER CRISP VIEW...</canvas>
        </div>

        <button id="downloadBtn" style="display:none;" onclick="downloadOriginalSheet()">>> Download Original Crisp Sheet <<</button>
        
        <div class="footer">
            HandleVault Digital • Crisp Suite Utility<br>
            <a href="https://ko-fi.com//Handlevaultofficial" target="_blank" class="kofi-link">☕ Support on Ko-fi</a>
        </div>
    </div>

    <script>
        let uploadedImageSrc = null;
        let originalWidth = 0;
        let originalHeight = 0;

        function handleImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImageSrc = e.target.result;
                const img = new Image();
                img.onload = function() {
                    originalWidth = img.width;
                    originalHeight = img.height;

                    const canvas = document.getElementById('previewCanvas');
                    const ctx = canvas.getContext('2d');

                    canvas.width = originalWidth;
                    canvas.height = originalHeight;

                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(img, 0, 0);

                    document.getElementById('downloadBtn').style.display = 'block';
                }
                img.src = uploadedImageSrc;
            }
            reader.readAsDataURL(file);
        }

        function downloadOriginalSheet() {
            if (!uploadedImageSrc) return;
            try {
                const link = document.createElement('a');
                link.download = 'crisp-original-sheet.png';
                link.href = uploadedImageSrc;
                link.click();
            } catch (err) {
                alert('Download failed due to browser security restrictions.');
            }
        }
    </script>

</body>
        </html>
