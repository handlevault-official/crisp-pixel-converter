 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Arcade Pixel Studio - Crisp Suite</title>
    <style>
        :root {
            --arcade-bg: #0d050a;
            --arcade-panel: #1a0d14;
            --arcade-border: #ff007f;
            --arcade-pink: #ff3399;
            --arcade-yellow: #ffee00;
            --text-color: #ff3399;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--arcade-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 750px;
            background: var(--arcade-panel);
            border: 3px solid var(--arcade-border);
            padding: 25px;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4), inset 0 0 15px rgba(255, 0, 127, 0.2);
            border-radius: 4px;
        }
        h1 {
            text-align: center;
            color: var(--arcade-yellow);
            font-size: 1.4rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px var(--arcade-border);
            letter-spacing: 2px;
        }
        .grid-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        @media (max-width: 600px) {
            .grid-controls { grid-template-columns: 1fr; }
        }
        .tool-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: var(--arcade-yellow);
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        input[type="file"], select, button {
            width: 100%;
            padding: 12px;
            background: #000;
            color: var(--text-color);
            border: 2px solid var(--arcade-border);
            border-radius: 0px;
            font-family: inherit;
            font-weight: bold;
            box-sizing: border-box;
            outline: none;
        }
        input[type="file"] {
            cursor: pointer;
            font-size: 0.75rem;
        }
        select option {
            background: #0d050a;
            color: var(--text-color);
        }
        button {
            background-color: var(--arcade-yellow);
            color: #000;
            cursor: pointer;
            margin-top: 10px;
            border-color: var(--arcade-yellow);
            box-shadow: 0 0 10px rgba(255, 238, 0, 0.5);
            transition: all 0.1s;
            text-transform: uppercase;
        }
        button:hover {
            background-color: var(--arcade-border);
            border-color: var(--arcade-border);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.7);
        }
        .preview-container {
            margin-top: 20px;
            text-align: center;
            border: 2px dashed var(--arcade-border);
            padding: 15px;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050204;
            overflow: auto;
        }
        canvas {
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
        }
        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            line-height: 1.8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .footer a {
            color: var(--arcade-yellow);
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .footer .kofi-link {
            color: var(--arcade-border);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>[ ULTIMATE ARCADE PIXEL STUDIO ]</h1>
        
        <div class="tool-group">
            <label for="imageUpload">> 1. Select Source Image</label>
            <input type="file" id="imageUpload" accept="image/*" onchange="handleImage(event)">
        </div>

        <div class="grid-controls">
            <div class="tool-group">
                <label for="gridSizeSelect">> 2. Pixel Resolution Block</label>
                <select id="gridSizeSelect" onchange="reprocessImage()">
                    <option value="32">32px (Coarse Retro)</option>
                    <option value="64" selected>64px (Standard Arcade)</option>
                    <option value="128">128px (High-Res 8-Bit)</option>
                </select>
            </div>
            <div class="tool-group">
                <label for="paletteSelect">> 3. Color Palette Mode</label>
                <select id="paletteSelect" onchange="reprocessImage()">
                    <option value="full" selected>Full True Color</option>
                    <option value="neon">Cyber Arcade Neon</option>
                    <option value="pastel">Soft Retro Pastel</option>
                </select>
            </div>
        </div>

        <div class="preview-container">
            <canvas id="pixelCanvas">UPLOAD IMAGE TO GENERATE PIXEL GRID...</canvas>
        </div>

        <button id="downloadBtn" style="display:none;" onclick="downloadImage()">>> Download Pixel Art Sheet <<</button>
        
        <div class="footer">
            HandleVault Digital • Crisp Suite Utility<br>
            <a href="https://ko-fi.com//Handlevaultofficial" target="_blank" class="kofi-link">☕ Support on Ko-fi</a>
        </div>
    </div>

    <script>
        let uploadedImage = null;

        function handleImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    uploadedImage = img;
                    processPixelArt();
                }
                img.onerror = function() {
                    alert('Error loading image file.');
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function reprocessImage() {
            if (uploadedImage) {
                processPixelArt();
            }
        }

        function processPixelArt() {
            if (!uploadedImage) return;

            const canvas = document.getElementById('pixelCanvas');
            const ctx = canvas.getContext('2d');
            
            const targetSize = parseInt(document.getElementById('gridSizeSelect').value);
            const paletteMode = document.getElementById('paletteSelect').value;

            // Maintain aspect ratio to prevent crushing/distorting the image
            const imgRatio = uploadedImage.width / uploadedImage.height;
            let targetWidth = targetSize;
            let targetHeight = targetSize;

            if (imgRatio > 1) {
                targetHeight = Math.round(targetSize / imgRatio);
            } else {
                targetWidth = Math.round(targetSize * imgRatio);
            }

            // 1. Draw downscaled image using direct hardware crisp scaling
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = targetWidth;
            tempCanvas.height = targetHeight;

            tempCtx.imageSmoothingEnabled = false;
            tempCtx.drawImage(uploadedImage, 0, 0, targetWidth, targetHeight);

            const imgData = tempCtx.getImageData(0, 0, targetWidth, targetHeight);
            const data = imgData.data;

            // 2. Scale up cleanly for display keeping sharp pixel edges (No blurring or crushing)
            const scale = 8;
            canvas.width = targetWidth * scale;
            canvas.height = targetHeight * scale;

            ctx.imageSmoothingEnabled = false;

            for (let y = 0; y < targetHeight; y++) {
                for (let x = 0; x < targetWidth; x++) {
                    const i = (y * targetWidth + x) * 4;
                    let r = data[i];
                    let g = data[i+1];
                    let b = data[i+2];

                    if (paletteMode === 'neon') {
                        r = r > 120 ? 255 : 0;
                        g = g > 120 ? 255 : 0;
                        b = b > 120 ? 255 : 0;
                    } else if (paletteMode === 'pastel') {
                        r = Math.min(255, r + 40);
                        g = Math.max(0, g - 15);
                        b = Math.min(255, b + 50);
                    }

                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.fillRect(x * scale, y * scale, scale, scale);
                }
            }

            document.getElementById('downloadBtn').style.display = 'block';
        }

        function downloadImage() {
            const canvas = document.getElementById('pixelCanvas');
            try {
                const link = document.createElement('a');
                link.download = 'arcade-pixel-grid.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                alert('Download failed due to browser security restrictions.');
            }
        }
    </script>

</body>
        </html>
