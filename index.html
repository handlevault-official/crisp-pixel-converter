<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Crisp Pixel Converter</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --border-color: #334155;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border: 2px solid var(--accent-color);
            padding: 20px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            color: var(--accent-color);
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .tool-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="file"], select, button {
            width: 100%;
            padding: 10px;
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: inherit;
            box-sizing: border-box;
        }
        button {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .preview-container {
            margin-top: 20px;
            text-align: center;
            border: 1px dashed var(--border-color);
            padding: 15px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090d16;
        }
        canvas {
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            line-height: 1.6;
        }
        .footer a {
            color: var(--accent-color);
            text-decoration: none;
        }
        .footer .kofi-link {
            color: #f472b6;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ PIXEL ART CONVERTER ⚡</h1>
        
        <div class="tool-group">
            <label for="imageUpload">Upload Image</label>
            <input type="file" id="imageUpload" accept="image/*" onchange="handleImage(event)">
        </div>

        <div class="tool-group">
            <label for="scaleSelect">Pixel Scale Factor</label>
            <select id="scaleSelect" onchange="reprocessImage()">
                <option value="2">2x Scale</option>
                <option value="4" selected>4x Scale (Recommended)</option>
                <option value="8">8x Scale</option>
            </select>
        </div>

        <div class="preview-container">
            <canvas id="pixelCanvas">Upload an image to preview pixel conversion.</canvas>
        </div>

        <button id="downloadBtn" style="display:none;" onclick="downloadImage()">Download Pixel Art</button>
        
        <div class="footer">
            Powered by <a href="https://github.com/handlevault-official" target="_blank">HandleVault Official</a><br>
            <a href="https://ko-fi.com//Handlevaultofficial" target="_blank" class="kofi-link">☕ Support on Ko-fi</a>
        </div>
    </div>

    <script>
        let uploadedImage = null;

        function handleImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    uploadedImage = img;
                    processPixelArt();
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function reprocessImage() {
            if (uploadedImage) {
                processPixelArt();
            }
        }

        function processPixelArt() {
            const canvas = document.getElementById('pixelCanvas');
            const ctx = canvas.getContext('2d');
            const scale = parseInt(document.getElementById('scaleSelect').value);

            // Compute scaled dimensions
            const width = Math.max(1, Math.floor(uploadedImage.width / scale));
            const height = Math.max(1, Math.floor(uploadedImage.height / scale));

            // Temporary small canvas for downsampling
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = width;
            tempCanvas.height = height;

            tempCtx.imageSmoothingEnabled = false;
            tempCtx.drawImage(uploadedImage, 0, 0, width, height);

            // Output crisp pixel canvas
            canvas.width = uploadedImage.width;
            canvas.height = uploadedImage.height;
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(tempCanvas, 0, 0, width, height, 0, 0, canvas.width, canvas.height);

            // Show download button
            document.getElementById('downloadBtn').style.display = 'block';
        }

        function downloadImage() {
            const canvas = document.getElementById('pixelCanvas');
            const link = document.createElement('a');
            link.download = 'pixel-art-converted.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>

</body>
</html>
