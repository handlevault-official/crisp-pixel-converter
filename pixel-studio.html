<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131b">
  <title>Pixel Studio — Handlevault</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #11131b; color: #f3f4f8; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 620px; padding: 28px; border: 1px solid #303646; border-radius: 16px; background: #191c27; }
    a { color: #bd9cff; }
  </style>
</head>
<body>
  <main id="status" role="status">Loading Pixel Studio…</main>
  <script>
    (async () => {
      const status = document.getElementById("status");
      try {
        const response = await fetch("https://raw.githubusercontent.com/handlevault-official/crisp-pixel-studio/313c9ba3d28365a1dd18090d77a04193dca3e1e2/index.html", { cache: "force-cache" });
        if (!response.ok) throw new Error(`Could not load the app (${response.status}).`);
        const appHtml = await response.text();
        document.open();
        document.write(appHtml);
        document.close();
      } catch (error) {
        status.innerHTML = `Pixel Studio could not load. Please check your internet connection and <a href="https://handlevault-official.github.io/crisp-pixel-studio/">return to Crisp Suite Studio</a>, then try again.`;
      }
    })();
  </script>
</body>
</html>
